apiVersion: apps/v1
kind: Deployment
metadata:
  name: amf-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amf
  template:
    metadata:
      labels:
        app: amf
    spec:
      containers:
      - name: amf
        image:  amf-aiops:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: amf-tls
          mountPath: /app/certs
      volumes:
      - name: amf-tls
        secret:
          secretName: amf-tls
